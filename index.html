<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粥粥的学习记录</title>
<style>
:root{--paper:#faf6ee;--ink:#3d3731;--dim:#8a8178;--line:#e8e0d2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 line-height:1.6;padding:16px}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;padding:20px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{margin:0;font-size:20px;font-weight:600}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.debt{background:#fff;border:1px solid var(--line);border-left:3px solid #b5503a;
 border-radius:8px;padding:12px 14px;margin-bottom:18px}
.debt.ok-all{border-left-color:#48754f}
.dtitle{font-size:13px;font-weight:600;margin-bottom:6px}
.db{display:inline-block;margin-right:10px;font-size:14px;color:var(--c);font-weight:600}
.week{background:#fff;border:1px solid var(--line);border-radius:10px;
 padding:14px;margin-bottom:14px}
.wh{font-size:15px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.ws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.st{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--c);color:var(--c)}
.st.ok{background:color-mix(in srgb,var(--c) 10%,#fff)}
.st.no{background:#fdf0ec;font-weight:600}
.wds{display:flex;flex-direction:column;gap:8px}
.day{border-left:2px solid var(--line);padding-left:10px}
.dh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dn{font-weight:600;font-size:14px}
.dw{color:var(--dim);font-size:12px}
.dt{display:inline-flex;gap:4px;margin-left:auto}
.tag{font-size:12px;font-weight:600}
.dnote{font-size:13px;color:#5a524a;margin-top:3px;white-space:pre-wrap}
.phs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.phs img{width:88px;height:66px;object-fit:cover;border-radius:6px;
 border:1px solid var(--line);display:block}
.empty{color:var(--dim);font-size:13px}
footer{text-align:center;color:var(--dim);font-size:12px;padding:18px 0}
@media(max-width:420px){body{padding:10px}.phs img{width:72px;height:54px}}
</style>
</head>
<body><div class="wrap">
<header><h1>📚 粥粥的学习记录</h1><div class="sub">2026年10月6日 更新</div></header>
<div class="debt ok-all"><div class="dtitle">不欠 ✅</div><span>所有科目都上够了</span></div>
<div class="week">
                <div class="wh"><b>10/5 – 10/11</b></div>
                <div class="ws"><span class="st ok" style="--c:#b5503a">语文 7/1 ✓</span><span class="st ok" style="--c:#3f6b96">数学 6/2 ✓</span><span class="st ok" style="--c:#48754f">英语 6/2 ✓</span></div>
                <div class="wds"><div class="day">
                    <div class="dh"><span class="dn">10/5</span>
                    <span class="dw">周一</span><span class="dt"><span class="tag" style="color:#b5503a">语</span></span></div>
                    
                    </div><div class="day">
                    <div class="dh"><span class="dn">10/6</span>
                    <span class="dw">周二</span><span class="dt"><span class="tag" style="color:#b5503a">语</span><span class="tag" style="color:#3f6b96">数</span><span class="tag" style="color:#48754f">英</span></span></div>
                    
                    </div><div class="day">
                    <div class="dh"><span class="dn">10/7</span>
                    <span class="dw">周三</span><span class="dt"><span class="tag" style="color:#b5503a">语</span><span class="tag" style="color:#3f6b96">数</span><span class="tag" style="color:#48754f">英</span></span></div>
                    
                    </div><div class="day">
                    <div class="dh"><span class="dn">10/8</span>
                    <span class="dw">周四</span><span class="dt"><span class="tag" style="color:#b5503a">语</span><span class="tag" style="color:#3f6b96">数</span><span class="tag" style="color:#48754f">英</span></span></div>
                    
                    </div><div class="day">
                    <div class="dh"><span class="dn">10/9</span>
                    <span class="dw">周五</span><span class="dt"><span class="tag" style="color:#b5503a">语</span><span class="tag" style="color:#3f6b96">数</span><span class="tag" style="color:#48754f">英</span></span></div>
                    
                    </div><div class="day">
                    <div class="dh"><span class="dn">10/10</span>
                    <span class="dw">周六</span><span class="dt"><span class="tag" style="color:#b5503a">语</span><span class="tag" style="color:#3f6b96">数</span><span class="tag" style="color:#48754f">英</span></span></div>
                    
                    </div><div class="day">
                    <div class="dh"><span class="dn">10/11</span>
                    <span class="dw">周日</span><span class="dt"><span class="tag" style="color:#b5503a">语</span><span class="tag" style="color:#3f6b96">数</span><span class="tag" style="color:#48754f">英</span></span></div>
                    
                    </div></div>
            </div>
<footer>WEEK OF WEEK · 粥粥记录</footer>
</div></body>
</html>
